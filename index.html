<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Demo Day 2026 · Evaluación</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#5b3373">
  <script>
    /* Aplica el tema elegido antes de pintar, para evitar un parpadeo. */
    try { var t = JSON.parse(localStorage.getItem('dd_theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* sin almacenamiento */ }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <footer class="site-footer">
    <img class="logo" src="assets/logo.png" alt="Logo de la carrera de Administración" width="440" height="400">
    <p>Realizado por <b>Alonzo Lara Flores</b></p>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar entre tema claro y oscuro">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="label">Tema oscuro</span>
    </button>
  </footer>
  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="rubric.js"></script>
  <script src="analytics.js"></script>
  <script src="store.js"></script>
  <script src="outbox.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
